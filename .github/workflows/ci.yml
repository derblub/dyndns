name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n dyndns.sh tests/test.sh
      - run: shellcheck --version
      - run: shellcheck -x dyndns.sh tests/test.sh
      - run: tests/test.sh
